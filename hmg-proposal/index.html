<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>보호된 문서</title>
<style>
:root {
  --bg: #f4f5f7;
  --paper: #ffffff;
  --text: #191c21;
  --muted: #6b7280;
  --border: #e2e5ea;
  --accent: #0b3d7a;
  --danger: #b42318;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1115;
    --paper: #171a20;
    --text: #e9ecf1;
    --muted: #9aa3b2;
    --border: #2a2f39;
    --accent: #8db8f5;
    --danger: #f97066;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
body {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px 16px;
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
}
form {
  width: 100%;
  max-width: 360px;
  padding: 28px 24px;
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: 16px;
}
h1 { font-size: 18px; margin: 0 0 6px; }
p { margin: 0 0 18px; font-size: 14px; color: var(--muted); }
label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
input {
  width: 100%;
  padding: 11px 12px;
  font: inherit;
  font-size: 15px;
  color: var(--text);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
}
input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
button {
  width: 100%;
  margin-top: 14px;
  padding: 11px 12px;
  font: inherit;
  font-size: 15px;
  font-weight: 700;
  color: #fff;
  background: var(--accent);
  border: 0;
  border-radius: 10px;
  cursor: pointer;
}
@media (prefers-color-scheme: dark) { button { color: #0f1115; } }
button:disabled { opacity: .6; cursor: progress; }
.error { min-height: 20px; margin: 10px 0 0; font-size: 13px; color: var(--danger); }
</style>
</head>
<body>
<form id="unlock" autocomplete="off">
  <h1>보호된 문서</h1>
  <p>비밀번호를 입력하면 이 브라우저 안에서 문서를 풀어 보여 줍니다.</p>
  <label for="pw">비밀번호</label>
  <input id="pw" type="password" autocomplete="current-password" required autofocus>
  <button id="go" type="submit">열기</button>
  <p class="error" id="err" role="alert"></p>
</form>

        return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.data));
      })
      .then(function (plain) {
        var html = new TextDecoder().decode(plain);
        document.open();
        document.write(html);
        document.close();
      })
      .catch(function () {
        err.textContent = '비밀번호가 맞지 않습니다.';
        btn.disabled = false;
        btn.textContent = '열기';
        input.select();
      });
  });
})();
</script>
